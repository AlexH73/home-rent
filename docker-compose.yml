services:
  db:
    image: postgres:16-alpine
    container_name: homerent-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homerent}
      POSTGRES_USER: ${POSTGRES_USER:-homerent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homerent}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - homerent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homerent} -d ${DB_NAME:-homerent}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homerent-app
    env_file:
      - .env
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_LIQUIBASE_CONTEXTS: ${SPRING_LIQUIBASE_CONTEXTS:-test}
      SPRINGDOC_SWAGGER_UI_URL: /v3/api-docs
      SPRINGDOC_API_DOCS_PATH: /v3/api-docs

      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-homerent}
      DB_USER: ${DB_USERNAME:-homerent}
      DB_PASSWORD: ${DB_PASSWORD:-homerent}

      EMAIL_FROM_USERNAME: ${EMAIL_FROM_USERNAME:-demo@example.com}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-demo}

      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8081}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: homerent-pgadmin
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  homerent_pgdata: