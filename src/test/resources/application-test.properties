# ===============================
# H2 Database (TEST - isolated)
# ===============================
#spring.datasource.url=jdbc:h2:mem:homerent_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.url=jdbc:h2:mem:homerent_test_${random.uuid};MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===============================
# Liquibase (TEST)
# ===============================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# You said: "with objects" -> enable seeded test objects (contexts dev,test in changelog)
spring.liquibase.contexts=test

# ===============================
# JPA / Hibernate
# ===============================
# Liquibase creates schema, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ===============================
# Scheduling (OFF in tests)
# ===============================
spring.task.scheduling.enabled=false

# ===============================
# Logging (quiet)
# ===============================
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.de.ait.homerent=INFO

# ===============================
# Mail (TEST - dummy values; avoid real SMTP)
# ===============================
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
# Include error messages in responses for integration test verification
server.error.include-message=always
