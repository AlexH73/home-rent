
# Application

spring.application.name=HomeRent
#spring.profiles.active=test

# H2 Database (TEST)

spring.datasource.url=jdbc:h2:mem:homerent_${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Liquibase (TEST)

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
#spring.liquibase.drop-first=true

# Logging
spring.liquibase.contexts=test

logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.de.ait.homerent=DEBUG

# Mail (TEST)
# ---- App mail (TEST) ----
app.mail.from=no-reply@test.local
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

#-------Multipart upload--------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

junit.jupiter.executions.parallel.enabled=false

# ----- STORAGE----------
app.upload.rental-contracts-dir=./uploads-test/rental-contracts
app.upload.rental-contracts-max-size=15728640

# ----- ISSUE PHOTOS STORAGE (TEST) ----------
app.upload.issues-dir=./uploads-test/issues
app.upload.issue-photo-max-size=5242880
app.upload.issue-photo-allowed-types=image/jpeg,image/png

# Disable scheduled tasks in tests
spring.task.scheduling.enabled=false


