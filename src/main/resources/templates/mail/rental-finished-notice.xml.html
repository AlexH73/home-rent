<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Rental Finished</title>
</head>
<body style="margin:0; padding:0; background:#f5f5f5; font-family: Arial, sans-serif; font-size:14px;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5; padding:20px 0;">
    <tr>
        <td align="center">
            <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:12px; overflow:hidden; font-size:14px;">
                <tr>
                    <td style="background:#111827; color:#ffffff; padding:20px; font-size:14px;">
                        <div style="font-size:18px; font-weight:bold;">HomeRent</div>
                        <div style="font-size:12px; opacity:0.85; margin-top:6px;">Rental Receipt</div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:24px; color:#111827; font-size:14px;">
                        <p>Hello, <b th:text="${username}">Guest</b>!</p>
                        <p>Your rental period has ended. Here is the summary:</p>
                        <table width="100%" style="border:1px solid #e5e7eb; border-radius:8px; padding:12px; font-size:14px;">
                            <tr>
                                <td>
                                    <p><b>Property:</b> <span th:text="${propertyAddress}">123 Main St.</span></p>
                                    <p><b>Period:</b> <span th:text="${startDate}">2026-03-01</span> - <span th:text="${endDate}">2026-03-10</span></p>
                                    <p><b>Total amount:</b> <span th:text="${totalPrice}">1500</span> USD</p>
                                </td>
                            </tr>
                        </table>
                        <p style="margin-top:16px; font-size:12px; color:#6b7280;">Thank you for using HomeRent.</p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:18px 24px; background:#f9fafb; color:#6b7280; font-size:12px;">Contact: support@homerent.example<br/>This email was generated automatically.</td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
