# ===============================
# PostgreSQL Database (PROD)
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/${DB_NAME:-homerent}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari pool
spring.datasource.hikari.maximum-pool-size=10

# ===============================
# Liquibase contexts (PROD)
# ===============================
# Do NOT include dev/test seeded data in production
spring.liquibase.contexts=prod

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ===============================
# H2 console (off)
# ===============================
spring.h2.console.enabled=false

# ===============================
# Logging (PROD - quiet)
# ===============================
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# ===============================
# Mail (PROD)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_FROM_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.public.base-url=${APP_BASE_URL:https://your-domain.com}