# ===============================
# Application
# ===============================
app.name=HomeRent
app.version=1.0.0
app.description=Home rental service system
app.contact.email=support@homerent.com
app.contact.url=https://homerent.example.com
spring.profiles.active=dev
# ===============================
# Server
# ===============================
server.port=8080
# ===============================
# Logging
# ===============================
logging.level.org.springframework.security=ERROR
# ===============================
# Mail (DEV)
# ===============================
app.mail.from=${EMAIL_FROM_USERNAME}
app.public.base-url=http://localhost:8080
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_FROM_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# ===============================
# Multipart upload
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
app.upload.rental-contracts-dir=./uploads/rental-contracts
app.upload.rental-contracts-max-size=15728640
app.upload.properties-dir=./uploads/properties
app.upload.property-max-size=5242880

app.upload.issues-dir=./uploads/issues
app.upload.issue-photo-max-size=5242880
app.upload.issue-photo-allowed-types=image/jpeg,image/png,image/jpg
# ===============================
# Swagger
# ===============================
spring.mvc.static-path-pattern=/static/**
spring.web.resources.static-locations=classpath:/static/

