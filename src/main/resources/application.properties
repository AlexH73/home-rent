# ===============================
# Application (common)
# ===============================
app.name=HomeRent
app.version=1.0.0
app.description=Home rental service system
app.contact.email=${EMAIL_FROM_USERNAME:support@homerent.com}
app.contact.url=${APP_BASE_URL:http://localhost:8080}

# NOTE:
# Do NOT set spring.profiles.active here.
# Use ENV/VM option instead, e.g. SPRING_PROFILES_ACTIVE=dev|test|prod|tc

# ===============================
# Server
# ===============================
server.port=8080

# If SPRING_PROFILES_ACTIVE is not set, use dev
spring.profiles.default=dev

# ===============================
# Liquibase (common)
# ===============================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ===============================
# JPA (common defaults)
# ===============================
spring.jpa.open-in-view=false

# ===============================
# Multipart upload
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Upload directories / limits
app.upload.rental-contracts-dir=./uploads/rental-contracts
app.upload.rental-contracts-max-size=15728640

app.upload.properties-dir=./uploads/properties
app.upload.property-max-size=5242880

app.upload.issues-dir=./uploads/issues
app.upload.issue-photo-max-size=5242880
app.upload.issue-photo-allowed-types=image/jpeg,image/png,image/jpg

# ===============================
# Mail (common)
# ===============================
app.mail.from=${EMAIL_FROM_USERNAME:no-reply@homerent.local}
app.public.base-url=${APP_BASE_URL:http://localhost:8080}