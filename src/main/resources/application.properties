# ===============================
# Application (common)
# ===============================
app.name=HomeRent
app.version=1.0.0
app.description=Home rental service system
app.contact.email=support@homerent.com
app.contact.url=https://homerent.example.com

# NOTE:
# Do NOT set spring.profiles.active here.
# Use ENV/VM option instead, e.g. SPRING_PROFILES_ACTIVE=dev|test|prod|tc

# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# Liquibase (common)
# ===============================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ===============================
# JPA (common defaults)
# ===============================
spring.jpa.open-in-view=false